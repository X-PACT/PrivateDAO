name: Agent Exchange discovery smoke

on:
  push:
    paths:
      - "integrations/**"
      - "sdk/agent-exchange/**"
      - "docs/agent-exchange-distribution/**"
      - "scripts/verify-agent-distribution.mjs"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  live-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-agent-distribution.mjs
