name: Build website

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"

      - name: Install root dependencies
        run: npm install

      - name: Install web dependencies
        run: npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Build root web mirror bundle
        run: npm run web:bundle:root

      - name: Build GitHub Pages redirect artifact
        run: node scripts/build-github-pages-redirect.mjs

      - name: Upload website build artifact
        uses: actions/upload-artifact@v4
        with:
          name: privatedao-website-build
          path: ./dist/github-pages-redirect
