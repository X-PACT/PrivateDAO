name: Publish PrivateDAO MCP server

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Prepare remote server metadata
        run: cp docs/agent-exchange-distribution/mcp-server.json server.json
      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate with MCP Registry through GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish remote MCP server
        run: ./mcp-publisher publish
