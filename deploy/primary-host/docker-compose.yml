name: privatedao-primary-host

services:
  record-engine:
    build:
      context: ../..
      dockerfile: services/private-engine/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "8787"
      PRIVATEDAO_CORS_ORIGIN: "https://privatedao.org"
      PRIVATEDAO_RECORD_ANCHOR_URL: "http://read-node:8787/api/v1/records/anchor"
      PRIVATEDAO_RECORD_ANCHOR_RECONCILE_URL: "http://read-node:8787/api/v1/records/anchor/reconcile"
      PRIVATEDAO_RECORD_VERIFICATION_PUBLIC: "true"
      PRIVATEDAO_DATA_DIR: "/data"
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - ./volumes/record-engine:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  read-node:
    build:
      context: ../..
      dockerfile: deploy/primary-host/read-node.Dockerfile
    env_file:
      - .env
    environment:
      TS_NODE_TRANSPILE_ONLY: "true"
    restart: unless-stopped
    expose:
      - "8787"
    volumes:
      - ./secrets:/srv/privatedao/deploy/primary-host/secrets:ro
      - ./volumes/runtime:/srv/privatedao/runtime
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/healthz').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 20s

  chain-watcher:
    build:
      context: ../..
      dockerfile: deploy/primary-host/read-node.Dockerfile
    env_file:
      - .env
    environment:
      TS_NODE_TRANSPILE_ONLY: "true"
    restart: unless-stopped
    command: ["npm", "run", "start:chain-watcher"]
    volumes:
      - ./secrets:/srv/privatedao/deploy/primary-host/secrets:ro
      - ./volumes/runtime:/srv/privatedao/runtime

  edge:
    image: caddy:2.10.2-alpine
    depends_on:
      read-node:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${PRIMARY_LOCAL_HTTP_BIND_PORT:-8080}:8080"
      - "${PRIMARY_EDGE_HTTP_BIND_PORT:-8081}:80"
      - "${PRIMARY_EDGE_HTTPS_BIND_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/site:/srv/privatedao/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
