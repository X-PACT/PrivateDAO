AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PrivateDAO Agent Exchange - isolated machine-native services.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        AGENT_DOMAIN: agents.privatedao.org
        SOLANA_TREASURY: 2BJ4ezxqV9YJXc38D9duKBkdn4su4jE1beKUHwH663sL
        SOLANA_USDC_MINT: EPjFWdd5AufSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        PDAO_MINT: 9isGuumtaqvJeJeyLF44fvfskk2cv5mYsopexMBfpump
        AGENT_GATEWAY_SOLANA_RPC_FALLBACK: https://api.mainnet-beta.solana.com
        AGENT_EXCHANGE_TABLE_PREFIX: !Sub '${AWS::StackName}'
        AGENT_EXCHANGE_QUOTES_TABLE: !Ref QuotesTable
        AGENT_EXCHANGE_PAYMENTS_TABLE: !Ref PaymentsTable
        AGENT_EXCHANGE_RECEIPTS_TABLE: !Ref ReceiptsTable
        AGENT_EXCHANGE_REGISTRY_TABLE: !Ref RegistryTable
        AGENT_EXCHANGE_JOBS_TABLE: !Ref JobsTable
        AGENT_EXCHANGE_CAMPAIGNS_TABLE: !Ref CampaignsTable
        AGENT_EXCHANGE_SOLANA_RPC_SECRET_ID: pdao/agent-exchange/solana-rpc
        AGENT_EXCHANGE_ADMIN_SECRET_ID: pdao/agent-exchange/admin-smoke
        BEDROCK_ENABLED: 'false'

Resources:
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['content-type', 'x-request-id']
        AllowMethods: ['GET', 'POST', 'OPTIONS']
  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/agent-exchange/
      Handler: src/handler.handler
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: '/{proxy+}'
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref QuotesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PaymentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ReceiptsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RegistryTable }
        - DynamoDBCrudPolicy: { TableName: !Ref JobsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CampaignsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ListingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AgreementsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LogisticsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref RevenueTable }
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pdao/agent-exchange/solana-rpc-*'
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pdao/agent-exchange/admin-smoke-*'
      Environment:
        Variables:
          AGENT_EXCHANGE_TABLE_PREFIX: !Ref AWS::StackName
          AGENT_EXCHANGE_QUOTES_TABLE: !Ref QuotesTable
          AGENT_EXCHANGE_PAYMENTS_TABLE: !Ref PaymentsTable
          AGENT_EXCHANGE_RECEIPTS_TABLE: !Ref ReceiptsTable
          AGENT_EXCHANGE_REGISTRY_TABLE: !Ref RegistryTable
          AGENT_EXCHANGE_JOBS_TABLE: !Ref JobsTable
          AGENT_EXCHANGE_CAMPAIGNS_TABLE: !Ref CampaignsTable
          AGENT_EXCHANGE_LISTINGS_TABLE: !Ref ListingsTable
          AGENT_EXCHANGE_AGREEMENTS_TABLE: !Ref AgreementsTable
          AGENT_EXCHANGE_LOGISTICS_TABLE: !Ref LogisticsTable
          AGENT_EXCHANGE_REVENUE_TABLE: !Ref RevenueTable
          AGENT_EXCHANGE_SOLANA_RPC_SECRET_ID: pdao/agent-exchange/solana-rpc
          AGENT_EXCHANGE_ADMIN_SECRET_ID: pdao/agent-exchange/admin-smoke
          AGENT_EXCHANGE_MARKETPLACE_FEE_BPS: 500
  QuotesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  ReceiptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  RegistryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  CampaignsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  ListingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  AgreementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  LogisticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }
  RevenueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{ AttributeName: id, AttributeType: S }]
      KeySchema: [{ AttributeName: id, KeyType: HASH }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

Outputs:
  ApiUrl: { Value: !GetAtt Api.ApiEndpoint }
  FunctionName: { Value: !Ref Function }
  QuotesTable: { Value: !Ref QuotesTable }
